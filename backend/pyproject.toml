[project]
name = "shortlist"
version = "0.1.0"
description = "Live, personalised internship and entry-level job feed for one batch, built on free tiers."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "httpx>=0.28",
    "pgvector>=0.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (start it with `docker compose up -d db`)",
    "model: loads the real embedding model (set RUN_MODEL_TESTS=1)",
]
