# Hand-kept rules on top of O*NET's "Hot Technologies" list (see README.md).
# build_taxonomy.py reads onet_hot_tech.txt, keeps the categories below, drops `drop`,
# renames with `rename`, adds every skill in `skills` with its aliases, and writes skills.yaml.

# O*NET commodity titles that describe engineering tools. Office, email, CAD, ERP and similar
# categories are left out entirely.
include_categories:
  - Analytical or scientific software
  - Application server software
  - Business intelligence and data analysis software
  - Cloud-based management software
  - Data base management system software
  - Data base user interface and query software
  - Development environment software
  - Enterprise application integration software
  - File versioning software
  - Object or component oriented development software
  - Operating system software
  - Web platform development software
  - Network operation system enhancement software
  - Configuration management software
  - Program testing software
  - Network security and virtual private network VPN equipment software
  - Transaction security and virus protection software
  - Platform interconnectivity software
  - Web page creation and editing software

# O*NET names that are not engineering skills, or too vague to match on.
