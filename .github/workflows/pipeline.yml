# Every 6 hours: fetch the job boards, extract features, embed, and purge old closed postings.
# Runs on GitHub's runners (free for public repos), so the API on Render stays small.
name: Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency: pipeline # never two runs at once; a late run waits instead of overlapping

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Neon direct URL: long-running batch work
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      FEEDBACK_LINK_SECRET: ${{ secrets.FEEDBACK_LINK_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EMBED_CACHE_DIR: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Cache the embedding model
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Seed skills (idempotent)
        run: uv run python -m app.cli seed-skills

      - name: Ingest, extract, embed, purge
        run: uv run python -m app.cli pipeline
