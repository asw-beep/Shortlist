# Runs on every push and pull request.
#   backend   lint, format, migrations, and every test against a real Postgres with pgvector
#   frontend  format, lint, types, tests, API types in sync with the backend, production build
#   image     the API image builds, carries its data files and model, and fits in 512 MB
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg17 # the same image as docker-compose.yml
        env:
          POSTGRES_USER: shortlist
          POSTGRES_PASSWORD: shortlist
          POSTGRES_DB: shortlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortlist -d shortlist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://shortlist:shortlist@localhost:5432/shortlist
      ENVIRONMENT: test
      # Fail, don't skip, if the integration tests cannot reach Postgres.
      REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Migrate and check the models match the migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # uv runs the backend's OpenAPI export for the API-types check below.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: API types match the backend
        run: |
          npm run api:types
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f backend/Dockerfile -t shortlist-api .

      # Offline (no network) and limited like Render Free: the model and data files must be
      # inside the image, and loading the app plus one embedding must fit in 512 MB.
      - name: The image runs offline within 512 MB
        run: |
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 0.1 \
            -e ENVIRONMENT=test shortlist-api python -c "
          from app.main import create_app
          app = create_app()
          vector = app.state.embedder.embed_query('python backend internship')
          assert len(vector) == 384, len(vector)
          print('ok: app built, ranking config and taxonomy loaded, model embedded offline')
          "
